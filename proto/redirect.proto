syntax = "proto3";

package redirect;

option go_package = "github.com/akuaruu/url-shortener/proto/gen/redirect";

// RedirectService resolves a short code to its original URL.
service RedirectService {
  // ResolveShortCode looks up the original URL for a given short code,
  // using a cache-aside strategy (Redis -> PostgreSQL fallback).
  rpc ResolveShortCode(ResolveRequest) returns (ResolveResponse);
}

message ResolveRequest {
  string short_code = 1;
}

message ResolveResponse {
  string original_url = 1;
  bool   found        = 2;
  bool   expired      = 3;
}
